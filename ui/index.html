<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archaeological Knowledge Graph</title>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: system-ui, sans-serif; background: #111; color: #eee; }
    #root { display: flex; height: 100vh; overflow: hidden; }

    /* ── sidebar ── */
    #sidebar {
      width: 310px; min-width: 310px;
      background: #1a1a1a; border-right: 1px solid #333;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #sidebar h1 {
      font-size: 0.87rem; font-weight: 600; padding: 12px 16px 10px;
      border-bottom: 1px solid #333; color: #ccc;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    #controls {
      padding: 12px 16px; border-bottom: 1px solid #333;
      overflow-y: auto;
    }
    .ctrl-section { margin-bottom: 16px; }
    .ctrl-section:last-child { margin-bottom: 0; }
    .ctrl-label {
      font-size: 0.67rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: #666; margin-bottom: 8px;
    }

    /* sliders */
    .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .slider-row input[type=range] { flex: 1; accent-color: #888; cursor: pointer; }
    .slider-type-label { font-size: 0.78rem; color: #bbb; width: 52px; flex-shrink: 0; }
    .slider-val { font-size: 0.74rem; color: #888; width: 28px; text-align: right; flex-shrink: 0; }

    /* geo-pin toggle */
    .geo-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.82rem; color: #ccc; }
    .geo-toggle input { cursor: pointer; accent-color: #5dbb7d; }

    /* k-nearest */
    .artifact-select {
      width: 100%; background: #222; color: #ccc;
      border: 1px solid #444; border-radius: 4px;
      padding: 5px 7px; font-size: 0.78rem; margin-bottom: 6px;
    }
    .knear-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .k-label { font-size: 0.78rem; color: #999; }
    .k-input {
      width: 50px; background: #222; color: #ccc;
      border: 1px solid #444; border-radius: 4px;
      padding: 4px 6px; font-size: 0.78rem; text-align: center;
    }
    .btn {
      padding: 4px 10px; font-size: 0.74rem;
      border-radius: 4px; border: 1px solid #555;
      cursor: pointer; background: #2a2a2a; color: #ccc;
    }
    .btn:hover { background: #363636; }
    .knear-hint { font-size: 0.70rem; color: #555; }

    /* ── detail panel ── */
    #detail { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .placeholder { color: #555; font-size: 0.82rem; }
    #detail h2 { font-size: 1rem; margin-bottom: 6px; }
    .era-badge {
      display: inline-block; background: #2a2a2a; border: 1px solid #444;
      border-radius: 4px; padding: 2px 8px; font-size: 0.71rem;
      color: #aaa; margin-bottom: 10px;
    }
    .field-label {
      font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: #666; margin-top: 10px; margin-bottom: 3px;
    }
    .field-value { font-size: 0.82rem; color: #ccc; line-height: 1.5; }
    .material-pill {
      display: inline-block; background: #272727; border: 1px solid #3a3a3a;
      border-radius: 12px; padding: 1px 8px; font-size: 0.74rem;
      margin: 2px 3px 2px 0; color: #bbb;
    }
    .coords { display: block; color: #666; font-size: 0.73rem; margin-top: 2px; }
    .img-hint { font-size: 0.64rem; color: #555; text-transform: none; letter-spacing: 0; }
    .image-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .image-strip img {
      width: 80px; height: 60px; object-fit: cover;
      border-radius: 4px; border: 2px solid transparent;
      cursor: pointer; transition: border-color 0.12s;
    }
    .image-strip img:hover { border-color: #666; }
    .image-strip img.chosen { border-color: #fff; }
    #detail a { color: #7aaddd; font-size: 0.78rem; word-break: break-all; }

    /* ── graph canvas ── */
    #graph-container { flex: 1; overflow: hidden; position: relative; }
    #graph-container svg { width: 100%; height: 100%; }

    .node { cursor: pointer; }
    .node-ring { fill: none; stroke: #444; stroke-width: 2px; }
    .node.selected .node-ring, .node:hover .node-ring { stroke: #fff; stroke-width: 2.5px; }
    .node.dimmed { opacity: 0.1; pointer-events: none; }
    .link { stroke-opacity: 0.5; }
    .link.dimmed { stroke-opacity: 0.03 !important; }
    .node.cluster .node-bg { fill: #2d5a8e; }
    .node.cluster .node-ring { stroke: #7ab0e8; stroke-width: 2px; }
    .cluster-count {
      fill: #fff; font-size: 9px; font-weight: 700;
      text-anchor: middle; dominant-baseline: middle;
      pointer-events: none;
    }
    .node-label {
      fill: #ccc; font-size: 9px; pointer-events: none;
      text-anchor: middle; dominant-baseline: hanging;
    }

    /* ── lightbox ── */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; cursor: zoom-out; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ── constants ─────────────────────────────────────────────────────────────────
const BASE      = new URL("../", window.location.href).href;
const NODE_R    = 11;   // default node radius
const GEO_NODE_R = 6;   // geo-pinned nodes (slightly larger so cluster badge fits)
const GEO_CLUSTER_R = 11; // cluster-leader node in geo mode

// Cache for world topology (fetched once on first map show)
let _worldCache = null;
async function fetchWorld() {
  if (_worldCache) return _worldCache;
  const r = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  _worldCache = await r.json();
  return _worldCache;
}

/**
 * Combined edge weight from per-type scores and slider values.
 * Only non-null components contribute to numerator AND denominator.
 */
function combinedWeight(link, w) {
  let sum = 0, denom = 0;
  if (link.temporal != null) { sum += link.temporal * w.temporal; denom += w.temporal; }
  if (link.spatial  != null) { sum += link.spatial  * w.spatial;  denom += w.spatial;  }
  if (link.material != null) { sum += link.material * w.material; denom += w.material; }
  return denom > 0 ? sum / denom : 0;
}

function fmtYear(y) { return y == null ? '?' : y < 0 ? `${Math.abs(y)} BCE` : `${y} CE`; }
/** Resolve an image path: full URLs are used as-is; relative paths get BASE prepended. */
function imgSrc(p) { return p?.startsWith('http') ? p : imgSrc(p); }
function trunc(s, n) { return s && s.length > n ? s.slice(0, n - 1) + '…' : (s || ''); }

/** Pin each node with known coords to its exact projected position (or release all). */
function pinNodesToGeo(sim, pin, projection) {
  if (!projection) return;
  sim.nodes().forEach(d => {
    const loc = d.data?.location;
    if (pin && loc?.lat != null && loc?.lng != null) {
      const [x, y] = projection([loc.lng, loc.lat]);
      d.fx = x; d.fy = y;
    } else {
      if (!d._dragging) { d.fx = null; d.fy = null; }
    }
  });
}

/**
 * Apply cluster visibility in geo mode.
 * Co-located nodes (same lat/lng) collapse into one "cluster" node showing a
 * count badge.  Clicking the cluster leader fans the members out in a circle.
 * Calling with an empty expandedSites collapses everything.
 */
function applyGeoCluster(nodeSel, siteGroups, nodeToSite, siteLeader, expandedSites, projection) {
  nodeSel.each(function(d) {
    const siteKey = nodeToSite.get(d.id);
    if (!siteKey) {
      // Single-node site — always visible, no badge
      d3.select(this).style('display', null).classed('cluster', false);
      d3.select(this).select('.cluster-count').text('');
      return;
    }
    const ids      = siteGroups.get(siteKey);
    const isLeader = siteLeader.get(siteKey) === d.id;
    const expanded = expandedSites.has(siteKey);
    const loc      = d.data.location;
    const [cx, cy] = projection([loc.lng, loc.lat]);

    if (expanded) {
      // Fan all members out in a circle around the site centre
      const i = ids.indexOf(d.id);
      const n = ids.length;
      const r = Math.max(GEO_NODE_R * 4, GEO_NODE_R * n * 0.9);
      const angle = (2 * Math.PI * i) / n - Math.PI / 2;
      d.fx = cx + r * Math.cos(angle);
      d.fy = cy + r * Math.sin(angle);
      d3.select(this).style('display', null).classed('cluster', false);
      d3.select(this).select('.cluster-count').text('');
      // Reset to standard geo node size
      const rr = GEO_NODE_R;
      d3.select(this).select('.node-bg').attr('r', rr);
      d3.select(this).select('.node-ring').attr('r', rr);
      d3.select(this).select('image').attr('x', -rr).attr('y', -rr).attr('width', rr*2).attr('height', rr*2);
      d3.select(this).select('.node-label').attr('y', rr + 3);
    } else if (isLeader) {
      d.fx = cx; d.fy = cy;
      d3.select(this).style('display', null).classed('cluster', true);
      d3.select(this).select('.cluster-count').text(ids.length);
      // Make cluster leaders bigger so the badge is legible
      const r = GEO_CLUSTER_R;
      d3.select(this).select('.node-bg').attr('r', r);
      d3.select(this).select('.node-ring').attr('r', r);
      d3.select(this).select('image').attr('x', -r).attr('y', -r).attr('width', r*2).attr('height', r*2);
      d3.select(this).select('.node-label').attr('y', r + 3);
    } else {
      d.fx = cx; d.fy = cy;
      d3.select(this).style('display', 'none');
    }
  });
}

/** Resize all node visual elements and update the collision force. */
function resizeNodes(nodeSel, defs, sim, r) {
  defs.selectAll('clipPath circle').attr('r', r);
  nodeSel.select('.node-bg').attr('r', r);
  nodeSel.select('image')
    .attr('x', -r).attr('y', -r)
    .attr('width', r * 2).attr('height', r * 2);
  nodeSel.select('.node-ring').attr('r', r);
  nodeSel.select('.node-label').attr('y', r + 3);
  sim.force('collision', d3.forceCollide(r + 4));
}

// ── WeightSliders ─────────────────────────────────────────────────────────────
function WeightSliders({ weights, onChange }) {
  const rows = [
    { key: 'temporal', color: '#5b8dd9', label: 'Temporal' },
    { key: 'spatial',  color: '#5dbb7d', label: 'Spatial'  },
    { key: 'material', color: '#e0994a', label: 'Material' },
  ];
  return (
    <div className="ctrl-section">
      <p className="ctrl-label">Edge strength weights</p>
      {rows.map(({ key, color, label }) => (
        <div key={key} className="slider-row">
          <span className="dot" style={{ background: color }} />
          <span className="slider-type-label">{label}</span>
          <input
            type="range" min="0" max="1" step="0.05"
            value={weights[key]}
            onChange={e => onChange({ ...weights, [key]: parseFloat(e.target.value) })}
          />
          <span className="slider-val">{weights[key].toFixed(2)}</span>
        </div>
      ))}
    </div>
  );
}

// ── KNearestFilter ────────────────────────────────────────────────────────────
function KNearestFilter({ nodes, onApply, onReset, hint }) {
  const [focusId, setFocusId] = React.useState('');
  const [k, setK] = React.useState(5);
  const sorted = React.useMemo(
    () => [...(nodes || [])].sort((a, b) => a.label.localeCompare(b.label)),
    [nodes]
  );
  function handleApply() { if (focusId) onApply(focusId, k); }
  function handleReset() { setFocusId(''); onReset(); }
  return (
    <div className="ctrl-section">
      <p className="ctrl-label">K-nearest to artifact</p>
      <select value={focusId} onChange={e => setFocusId(e.target.value)} className="artifact-select">
        <option value="">— choose artifact —</option>
        {sorted.map(n => <option key={n.id} value={n.id}>{trunc(n.label, 38)}</option>)}
      </select>
      <div className="knear-row">
        <span className="k-label">K =</span>
        <input type="number" min="1" max="99" value={k}
          onChange={e => setK(Math.max(1, parseInt(e.target.value) || 5))}
          className="k-input" />
        <button className="btn" onClick={handleApply}>Apply</button>
        <button className="btn" onClick={handleReset}>Reset</button>
      </div>
      <p className="knear-hint">{hint}</p>
    </div>
  );
}

// ── ArtifactDetail ────────────────────────────────────────────────────────────
function ArtifactDetail({ artifact, chosenIdx, onChooseImage }) {
  const [lightboxSrc, setLightboxSrc] = React.useState(null);
  if (!artifact) return <p className="placeholder">Click a node to see artifact details.</p>;

  const era = artifact.era || {};
  const loc = artifact.location || {};
  const eraStr = era.name
    ? `${era.name}${era.year_start != null ? ` (${fmtYear(era.year_start)} – ${fmtYear(era.year_end)})` : ''}`
    : 'Unknown era';

  return (
    <div>
      <h2>{artifact.label || artifact.id}</h2>
      <span className="era-badge">{eraStr}</span>

      {artifact.description && <>
        <p className="field-label">Description</p>
        <p className="field-value">{artifact.description}</p>
      </>}

      {artifact.material?.length > 0 && <>
        <p className="field-label">Material</p>
        <p className="field-value">
          {artifact.material.map((m, i) => <span key={i} className="material-pill">{m}</span>)}
        </p>
      </>}

      {loc.site && <>
        <p className="field-label">Site</p>
        <p className="field-value">
          {loc.site}{loc.region ? `, ${loc.region}` : ''}
          {loc.lat != null && <span className="coords">{loc.lat.toFixed(4)}, {loc.lng.toFixed(4)}</span>}
        </p>
      </>}

      {artifact.function && <>
        <p className="field-label">Function</p>
        <p className="field-value">{artifact.function}</p>
      </>}

      {artifact.images?.length > 0 && <>
        <p className="field-label">
          Images{' '}
          <span className="img-hint">(click = show in node · double-click = zoom)</span>
        </p>
        <div className="image-strip">
          {artifact.images.map((p, i) => (
            <img
              key={i}
              src={imgSrc(p)}
              alt=""
              className={i === chosenIdx ? 'chosen' : ''}
              onError={e => { e.target.style.display = 'none'; }}
              onClick={() => onChooseImage(artifact.id, i)}
              onDoubleClick={() => setLightboxSrc(imgSrc(p))}
            />
          ))}
        </div>
      </>}

      {artifact.url && <>
        <p className="field-label">Source</p>
        <a href={artifact.url} target="_blank" rel="noopener">{artifact.url}</a>
      </>}

      {lightboxSrc && (
        <div className="lightbox" onClick={() => setLightboxSrc(null)}>
          <img src={lightboxSrc} alt="artifact" />
        </div>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [graphData, setGraphData]       = React.useState(null);
  const [loadError, setLoadError]       = React.useState(null);
  const [selectedArtifact, setSelected] = React.useState(null);
  const [weights, setWeights]           = React.useState({ temporal: 1, spatial: 1, material: 1 });
  const [kHint, setKHint]               = React.useState('Select an artifact and press Apply.');
  const [chosenImages, setChosenImages] = React.useState({});
  const [geoPin, setGeoPin]             = React.useState(false);

  const svgRef     = React.useRef(null);
  const d3Ref      = React.useRef({});
  const weightsRef = React.useRef(weights);
  weightsRef.current = weights;
  const geoPinRef  = React.useRef(false);
  geoPinRef.current = geoPin;

  // ── Load graph.json ─────────────────────────────────────────────────────────
  React.useEffect(() => {
    fetch(BASE + 'graph.json')
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(setGraphData)
      .catch(e => setLoadError(e.message));
  }, []);

  // ── Init D3 once data arrives ────────────────────────────────────────────────
  React.useEffect(() => {
    if (graphData && svgRef.current) initD3(graphData);
  }, [graphData]);

  // ── Sync forces + edge visuals whenever weights change ───────────────────────
  React.useEffect(() => {
    const { simulation, linkSel, links, projection } = d3Ref.current;
    if (!simulation || !linkSel || !links) return;
    const w = weights;
    linkSel
      .style('stroke-width', d => (0.5 + combinedWeight(d, w) * 6) + 'px')
      .style('display', d => combinedWeight(d, w) > 0 ? null : 'none');
    simulation.force('link',
      d3.forceLink(links).id(d => d.id)
        .distance(d => 200 - combinedWeight(d, w) * 130)
        .strength(d => Math.max(0.02, combinedWeight(d, w) * 0.5))
    );
    simulation.alpha(0.3).restart();
  }, [weights]);

  // ── Toggle geographic pin: show/hide map, resize nodes, update forces ────────
  React.useEffect(() => {
    const { simulation, nodeSel, linkSel, defs, mapG, projection,
            siteGroups, nodeToSite, siteLeader, expandedSites } = d3Ref.current;
    if (!simulation) return;

    const r = geoPin ? GEO_NODE_R : NODE_R;
    resizeNodes(nodeSel, defs, simulation, r);

    if (geoPin) {
      pinNodesToGeo(simulation, true, projection);
      applyGeoCluster(nodeSel, siteGroups, nodeToSite, siteLeader, expandedSites, projection);
      // Hide zero-length same-site edges (both endpoints at same collapsed cluster)
      linkSel.style('display', d => {
        const src = typeof d.source === 'object' ? d.source.id : d.source;
        const tgt = typeof d.target === 'object' ? d.target.id : d.target;
        const ss = nodeToSite.get(src), ts = nodeToSite.get(tgt);
        if (ss && ss === ts && !expandedSites.has(ss)) return 'none';
        return combinedWeight(d, weightsRef.current) > 0 ? null : 'none';
      });
      simulation.force('center', null);
      simulation.force('charge', d3.forceManyBody().strength(-20));
      simulation.force('collision', null);

      // Show map (fetch on first use)
      mapG.style('display', null);
      if (mapG.selectAll('path').empty()) {
        fetchWorld().then(world => {
          const countries = topojson.feature(world, world.objects.countries);
          const path = d3.geoPath(projection);
          mapG.selectAll('path')
            .data(countries.features)
            .join('path')
            .attr('d', path)
            .attr('fill', '#162016')
            .attr('stroke', '#2a3d2a')
            .attr('stroke-width', 0.5);
        });
      }
    } else {
      pinNodesToGeo(simulation, false, projection);
      // Restore all nodes and clear cluster state
      nodeSel.style('display', null).classed('cluster', false);
      nodeSel.selectAll('.cluster-count').text('');
      expandedSites?.clear();
      linkSel.style('display', d => combinedWeight(d, weightsRef.current) > 0 ? null : 'none');
      const { W, H } = d3Ref.current;
      simulation.force('center', d3.forceCenter(W / 2, H / 2));
      simulation.force('charge', d3.forceManyBody().strength(-300));
      simulation.force('collision', d3.forceCollide(NODE_R + 8));
      mapG.style('display', 'none');
    }

    simulation.alpha(0.8).restart();
  }, [geoPin]);

  // ── Choose which image is displayed inside a node ───────────────────────────
  function handleChooseImage(artifactId, index) {
    setChosenImages(prev => ({ ...prev, [artifactId]: index }));
    d3Ref.current.nodeSel
      ?.filter(d => d.id === artifactId)
      .select('image')
      .attr('href', d => {
        const p = d.data.images?.[index];
        return p ? imgSrc(p) : '';
      });
  }

  // ── K-nearest filter ─────────────────────────────────────────────────────────
  function applyKFilter(focusId, k) {
    const { nodeSel, linkSel } = d3Ref.current;
    if (!nodeSel || !linkSel || !graphData) return;
    const w = weightsRef.current;

    const scores = {};
    graphData.links.forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      const cw = combinedWeight(l, w);
      if (s === focusId) scores[t] = Math.max(scores[t] ?? 0, cw);
      if (t === focusId) scores[s] = Math.max(scores[s] ?? 0, cw);
    });

    const topK = Object.entries(scores)
      .sort((a, b) => b[1] - a[1])
      .slice(0, k)
      .map(e => e[0]);
    const keep = new Set([focusId, ...topK]);

    nodeSel.classed('dimmed', d => !keep.has(d.id));
    linkSel.classed('dimmed', d => {
      const s = typeof d.source === 'object' ? d.source.id : d.source;
      const t = typeof d.target === 'object' ? d.target.id : d.target;
      return !keep.has(s) || !keep.has(t);
    });

    const name = graphData.nodes.find(n => n.id === focusId)?.label || focusId;
    setKHint(`Showing ${topK.length} neighbor(s) of "${trunc(name, 28)}".`);
  }

  function resetKFilter() {
    d3Ref.current.nodeSel?.classed('dimmed', false);
    d3Ref.current.linkSel?.classed('dimmed', false);
    setKHint('Select an artifact and press Apply.');
  }

  // ── D3 initialisation ─────────────────────────────────────────────────────
  function initD3(data) {
    const svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();

    const container = svgRef.current.parentElement;
    const W = container.clientWidth, H = container.clientHeight;
    svg.attr('viewBox', `0 0 ${W} ${H}`);

    // D3 equirectangular projection auto-zoomed to the data's bounding box.
    // Falls back to the full sphere if fewer than 2 artifacts have coordinates.
    const pad = Math.min(W, H) * 0.08;
    const projection = d3.geoEquirectangular();
    const coordNodes = data.nodes.filter(n => n.data?.location?.lat != null);
    if (coordNodes.length >= 2) {
      const lngs = coordNodes.map(n => n.data.location.lng);
      const lats  = coordNodes.map(n => n.data.location.lat);
      const extPad = 8; // degrees of padding around the data extent
      const bbox = {
        type: 'Feature',
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [Math.min(...lngs) - extPad, Math.min(...lats) - extPad],
            [Math.max(...lngs) + extPad, Math.min(...lats) - extPad],
            [Math.max(...lngs) + extPad, Math.max(...lats) + extPad],
            [Math.min(...lngs) - extPad, Math.max(...lats) + extPad],
            [Math.min(...lngs) - extPad, Math.min(...lats) - extPad],
          ]],
        },
      };
      projection.fitExtent([[pad, pad], [W - pad, H - pad]], bbox);
    } else {
      projection.fitExtent([[pad, pad], [W - pad, H - pad]], { type: 'Sphere' });
    }

    const nodes = data.nodes.map(d => ({ ...d }));
    const links = data.links.map(d => ({ ...d }));
    const w     = weightsRef.current;

    // ── Site groups for geo clustering ───────────────────────────────────────
    const siteGroups = new Map(); // siteKey → [id, ...]
    nodes.forEach(d => {
      const loc = d.data?.location;
      if (loc?.lat != null && loc?.lng != null) {
        const key = `${loc.lat.toFixed(4)},${loc.lng.toFixed(4)}`;
        if (!siteGroups.has(key)) siteGroups.set(key, []);
        siteGroups.get(key).push(d.id);
      }
    });
    const nodeToSite = new Map(); // id → siteKey  (only multi-node sites)
    const siteLeader = new Map(); // siteKey → leaderId
    siteGroups.forEach((ids, key) => {
      if (ids.length > 1) {
        siteLeader.set(key, ids[0]);
        ids.forEach(id => nodeToSite.set(id, key));
      }
    });
    const expandedSites = new Set();

    // clip-paths for node thumbnails
    const defs = svg.append('defs');
    nodes.forEach(d => {
      defs.append('clipPath')
        .attr('id', 'cp-' + d.id.replace(/[^a-z0-9]/gi, ''))
        .append('circle').attr('r', NODE_R);
    });

    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.1, 30]).on('zoom', e => g.attr('transform', e.transform)));

    // Map layer — hidden until geo pin is enabled
    const mapG = g.append('g').attr('class', 'map-layer').style('display', 'none');

    // links
    const linkSel = g.append('g').selectAll('line')
      .data(links).join('line')
      .attr('class', 'link')
      .style('stroke', '#6699cc')
      .style('stroke-width', d => (0.5 + combinedWeight(d, w) * 6) + 'px');

    // nodes
    const nodeSel = g.append('g').selectAll('g')
      .data(nodes).join('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', (ev, d) => {
          if (!ev.active) sim.alphaTarget(0.3).restart();
          d._dragging = true; d.fx = d.x; d.fy = d.y;
        })
        .on('drag',  (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
        .on('end',   (ev, d) => {
          if (!ev.active) sim.alphaTarget(0);
          d._dragging = false;
          if (geoPinRef.current) {
            const siteKey = nodeToSite.get(d.id);
            if (siteKey && expandedSites.has(siteKey)) {
              applyGeoCluster(nodeSel, siteGroups, nodeToSite, siteLeader, expandedSites, projection);
            } else {
              const loc = d.data?.location;
              if (loc?.lat != null && loc?.lng != null) {
                const [x, y] = projection([loc.lng, loc.lat]);
                d.fx = x; d.fy = y;
              } else { d.fx = null; d.fy = null; }
            }
          } else {
            d.fx = null; d.fy = null;
          }
        }))
      .on('click', (ev, d) => {
        ev.stopPropagation();
        // In geo mode: click on a collapsed cluster leader → expand it
        if (geoPinRef.current && nodeToSite.has(d.id)) {
          const siteKey = nodeToSite.get(d.id);
          if (siteLeader.get(siteKey) === d.id && !expandedSites.has(siteKey)) {
            expandedSites.add(siteKey);
            applyGeoCluster(nodeSel, siteGroups, nodeToSite, siteLeader, expandedSites, projection);
            sim.alpha(0.3).restart();
            return;
          }
        }
        nodeSel.classed('selected', false);
        d3.select(ev.currentTarget).classed('selected', true);
        setSelected(d.data);
      });

    nodeSel.append('circle').attr('class', 'node-bg').attr('r', NODE_R).attr('fill', '#1e3a54');

    nodeSel.append('image')
      .attr('href', d => { const p = d.data.images?.[0]; return p ? imgSrc(p) : ''; })
      .attr('x', -NODE_R).attr('y', -NODE_R)
      .attr('width', NODE_R * 2).attr('height', NODE_R * 2)
      .attr('preserveAspectRatio', 'xMidYMid slice')
      .attr('clip-path', d => `url(#cp-${d.id.replace(/[^a-z0-9]/gi, '')})`)
      .style('pointer-events', 'none');

    nodeSel.append('circle').attr('class', 'node-ring').attr('r', NODE_R);
    nodeSel.append('text').attr('class', 'node-label').attr('y', NODE_R + 3)
      .text(d => trunc(d.label, 16));
    nodeSel.append('text').attr('class', 'cluster-count').attr('y', 0).text('');

    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id)
        .distance(d => 200 - combinedWeight(d, w) * 130)
        .strength(d => Math.max(0.02, combinedWeight(d, w) * 0.5)))
      .force('charge',    d3.forceManyBody().strength(-300))
      .force('center',    d3.forceCenter(W / 2, H / 2))
      .force('collision', d3.forceCollide(NODE_R + 8))
      .on('tick', () => {
        linkSel
          .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
      });

    svg.on('click', () => {
      nodeSel.classed('selected', false);
      setSelected(null);
      if (geoPinRef.current && expandedSites.size > 0) {
        expandedSites.clear();
        applyGeoCluster(nodeSel, siteGroups, nodeToSite, siteLeader, expandedSites, projection);
        sim.alpha(0.3).restart();
      }
    });

    d3Ref.current = {
      simulation: sim, nodeSel, linkSel, links, defs, mapG, projection, W, H,
      siteGroups, nodeToSite, siteLeader, expandedSites,
    };
  }

  // ── Render ────────────────────────────────────────────────────────────────
  if (loadError) return (
    <div style={{ padding: 24, color: '#c55' }}>
      <p>Could not load graph.json: {loadError}</p>
      <p style={{ marginTop: 10, color: '#888' }}>
        Run <code>python serve.py</code> from <code>ver_1/</code>, then open{' '}
        <code>http://localhost:8765/ui/</code>
      </p>
    </div>
  );

  const selId     = selectedArtifact?.id;
  const chosenIdx = selId != null ? (chosenImages[selId] ?? 0) : 0;

  return (
    <>
      <div id="sidebar">
        <h1>Artifact Graph</h1>
        <div id="controls">
          <WeightSliders weights={weights} onChange={setWeights} />
          <div className="ctrl-section">
            <p className="ctrl-label">Geographic layout</p>
            <label className="geo-toggle">
              <input type="checkbox" checked={geoPin} onChange={e => setGeoPin(e.target.checked)} />
              <span>Pin nodes to map coordinates</span>
            </label>
            <p className="knear-hint">Nodes with lat/lng are pulled to their real-world position. Strength follows the Spatial slider.</p>
          </div>
          <KNearestFilter
            nodes={graphData?.nodes}
            onApply={applyKFilter}
            onReset={resetKFilter}
            hint={kHint}
          />
        </div>
        <div id="detail">
          <ArtifactDetail
            artifact={selectedArtifact}
            chosenIdx={chosenIdx}
            onChooseImage={handleChooseImage}
          />
        </div>
      </div>
      <div id="graph-container">
        <svg ref={svgRef} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
